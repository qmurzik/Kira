name: VKLite (Пульс) - Build

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: vklite-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ID of the owner's VK ID app (public, it is part of every authorize URL).
  # Bakes vk<ID>://vk.com/blank.html into the manifest for the browser login flow.
  VK_CLIENT_ID: "54837133"

jobs:
  build:
    name: Static checks, debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static project checks (no SDK needed)
        run: |
          python3 scripts/check_project.py
          python3 scripts/check_symbols.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Stable signing key without committing it: kept in the Actions cache of this repo.
      # Same key for every build => the SHA-1 in the VK ID cabinet stays valid and updates install
      # over the previous version. If the cache is ever evicted a new key is generated (reinstall once).
      - name: Restore signing key
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.pulse-signing/pulse.keystore
          key: pulse-signing-keystore-v2

      - name: Create signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.pulse-signing
          keytool -genkeypair -v -keystore ~/.pulse-signing/pulse.keystore -storepass pulse-ci -keypass pulse-ci \
            -alias pulse -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pulse, O=Pulse, C=RU"

      - name: Save signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pulse-signing/pulse.keystore
          key: pulse-signing-keystore-v2

      - name: Use signing key for all build types
        run: |
          {
            echo "PULSE_KEYSTORE_PATH=$HOME/.pulse-signing/pulse.keystore"
            echo "PULSE_KEYSTORE_PASSWORD=pulse-ci"
            echo "PULSE_KEY_ALIAS=pulse"
            echo "PULSE_KEY_PASSWORD=pulse-ci"
          } >> "$GITHUB_ENV"
          keytool -list -v -keystore ~/.pulse-signing/pulse.keystore -storepass pulse-ci -alias pulse | grep -E "SHA1|SHA256"

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Release = R8 + resource shrinking. Signed with the debug key unless
      # keystore secrets are configured: for size measurement and side-loading only.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint (report only)
        run: ./gradlew lintDebug --stacktrace

      - name: APK sizes
        run: |
          ls -l app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk | tee sizes.txt
          { echo "### APK sizes"; echo '```'; cat sizes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vklite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: vklite-release-apk-debugsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vklite-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # Installs the R8 release APK on emulators (minSdk 21 and a modern API), measures cold start,
  # walks through the login screen and fails on any crash. Login itself needs a real VK account.
  smoke:
    name: Emulator smoke test (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vklite-release-apk-debugsigned
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: vklite-debug-apk
          path: apk-debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 scripts/smoke_test.py apk/app-release.apk smoke-out
            if [ "${{ matrix.api }}" = "34" ]; then python3 scripts/smoke_test.py apk-debug/app-debug.apk smoke-debug app.pulse.client.debug; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: |
            smoke-out
            smoke-debug
          if-no-files-found: ignore
          retention-days: 14

  # Direct download link for phones: a pre-release that is replaced on every push to this branch.
  publish:
    name: Publish APK to GitHub Release
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/vk-lite-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vklite-release-apk-debugsigned
          path: out/release
      - uses: actions/download-artifact@v4
        with:
          name: vklite-debug-apk
          path: out/debug
      - name: Rename
        run: |
          mv out/release/app-release.apk out/pulse-release.apk
          mv out/debug/app-debug.apk out/pulse-debug.apk
          ls -l out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vk-lite-latest
          target_commitish: ${{ github.sha }}
          name: "Пульс (VK Lite) — сборка ${{ github.run_number }}"
          prerelease: true
          make_latest: false
          body: |
            Автосборка ветки `vk-lite-app`, коммит ${{ github.sha }}.
            Прошла smoke-тест на эмуляторах API 21 и 34 (запуск, экран входа, переход на VK ID, без падений).
            На реальном устройстве и с реальным входом не проверялась — см. docs/UNVERIFIED.md.

            - `pulse-release.apk` — R8, подписан debug-ключом (для установки себе, не для публикации).
            - `pulse-debug.apk` — отладочная сборка.
          files: |
            out/pulse-release.apk
            out/pulse-debug.apk
