name: AnimeTV - Build

on:
  push:
    branches: ["**"]
    paths:
      - "AnimeTV/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "AnimeTV/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: animetv-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AnimeTV

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners already ship an Android SDK (ANDROID_HOME is
      # preset); we just need to make sure the exact platform/build-tools this project
      # targets (see app/build.gradle.kts: compileSdk 34) are installed and licensed.
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint (debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests (debug)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animetv-debug-apk
          path: AnimeTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animetv-lint-report
          path: AnimeTV/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    needs: build
    # Only meaningful on the main branch, and only when release-signing secrets are
    # configured for this repository - see AnimeTV/README.md "Release signing".
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets are configured
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANIMETV_KEYSTORE_BASE64 != '' }}
        run: echo "configured=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.signing.outputs.configured == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with build cache)
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "${{ secrets.ANIMETV_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          ANIMETV_KEYSTORE_PATH=${{ github.workspace }}/AnimeTV/release.keystore
          ANIMETV_KEYSTORE_PASSWORD=${{ secrets.ANIMETV_KEYSTORE_PASSWORD }}
          ANIMETV_KEY_ALIAS=${{ secrets.ANIMETV_KEY_ALIAS }}
          ANIMETV_KEY_PASSWORD=${{ secrets.ANIMETV_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        if: steps.signing.outputs.configured == 'true'
        run: chmod +x ./gradlew

      - name: Assemble release APK
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: animetv-release-apk
          path: AnimeTV/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore keystore.properties
