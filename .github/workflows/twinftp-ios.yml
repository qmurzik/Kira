name: TwinFTP iOS

on:
  push:
    branches: ["**"]
    paths:
      - "TwinFTP/**"
      - ".github/workflows/twinftp-ios.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Опубликовать GitHub Release с IPA"
        type: boolean
        default: false
      release_tag:
        description: "Тег релиза (например, twinftp-v1.0.0)"
        type: string
        default: ""

concurrency:
  group: twinftp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: TwinFTP

jobs:
  build:
    name: Тесты ядра, сборка и unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Выбор Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Используется $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Python-окружение для тестового FTP-сервера
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyftpdlib pyzipper
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Проверка, что проект соответствует генератору
        run: |
          python3 Scripts/generate_xcodeproj.py
          git diff --exit-code -- TwinFTP.xcodeproj || (echo "::warning::TwinFTP.xcodeproj отличается от сгенерированного" )

      - name: Тесты TwinCore (юнит + интеграционные с реальным FTP)
        id: coretests
        continue-on-error: true
        working-directory: TwinFTP/Packages/TwinCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
          grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/core-tests.log" | tail -1

      - name: Сборка приложения (iphoneos, без подписи)
        run: |
          set -o pipefail
          xcodebuild \
            -project TwinFTP.xcodeproj \
            -scheme TwinFTP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log" || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -100; exit 1; }

      - name: Упаковка unsigned IPA
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/TwinFTP.app"
          test -d "$APP"
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry TwinFTP-unsigned.ipa Payload)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$STAGE/TwinFTP-unsigned.ipa" "$GITHUB_WORKSPACE/out/"
          echo "=== Проверка структуры IPA ==="
          unzip -l "$GITHUB_WORKSPACE/out/TwinFTP-unsigned.ipa" | grep -E "Payload/TwinFTP.app/(TwinFTP|Info.plist|Assets.car)$"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion|CFBundleDisplayName"
          lipo -info "$APP/TwinFTP"
          otool -l "$APP/TwinFTP" | grep -A4 LC_BUILD_VERSION | head -6
          shasum -a 256 "$GITHUB_WORKSPACE/out/TwinFTP-unsigned.ipa" | tee "$GITHUB_WORKSPACE/out/SHA256.txt"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: UI-тест на симуляторе с реальным FTP-сервером (снимки экрана)
        id: uitests
        continue-on-error: true
        run: |
          set -o pipefail
          FTPROOT="$RUNNER_TEMP/ftproot"
          mkdir -p "$FTPROOT"
          echo "TwinFTP UI test" > "$FTPROOT/readme.txt"
          python3 Scripts/test_ftp_server.py --port 2121 --root "$FTPROOT" > "$RUNNER_TEMP/ftpserver.log" 2>&1 &
          FTP_PID=$!
          sleep 2
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          # Ближе всего к iPhone XS по ширине (375 pt) — iPhone SE 3; затем 16e/17/любой iPhone.
          DEVICE=""
          for NAME in "iPhone SE (3rd generation)" "iPhone 16e" "iPhone 17" "iPhone 16"; do
            DEVICE=$(xcrun simctl list devices available | grep -F "    $NAME (" | head -1 | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/' || true)
            if [ -n "$DEVICE" ]; then echo "Выбран: $NAME"; break; fi
          done
          if [ -z "$DEVICE" ]; then DEVICE=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | head -1 | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/' || true); fi
          echo "Симулятор: $DEVICE"
          xcodebuild test -project TwinFTP.xcodeproj -scheme TwinFTP -destination "id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/uitest.log" | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          echo "=== Содержимое FTP-сервера после UI-теста ==="
          ls -laR "$FTPROOT" || true
          kill $FTP_PID || true
          mkdir -p "$GITHUB_WORKSPACE/out/screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/UITests.xcresult" --output-path "$GITHUB_WORKSPACE/out/screenshots" || true
          ls -la "$GITHUB_WORKSPACE/out/screenshots" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/uitest.log"

      - name: Логи сборки
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          cp "$RUNNER_TEMP"/*.log "$GITHUB_WORKSPACE/out/logs/" 2>/dev/null || true

      - name: Артефакт IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwinFTP-unsigned-ipa
          path: |
            out/TwinFTP-unsigned.ipa
            out/SHA256.txt
          if-no-files-found: warn

      - name: Артефакт логов и снимков экрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwinFTP-logs-and-screenshots
          path: |
            out/logs
            out/screenshots
          if-no-files-found: ignore

      - name: Итог тестов
        if: always()
        run: |
          echo "Тесты ядра: ${{ steps.coretests.outcome }}"
          echo "UI-тест: ${{ steps.uitests.outcome }}"
          if [ "${{ steps.coretests.outcome }}" != "success" ]; then
            echo "::error::Тесты TwinCore не прошли — см. шаг тестов"; exit 1
          fi
          if [ "${{ steps.uitests.outcome }}" != "success" ]; then
            echo "::warning::UI-тест на симуляторе не прошёл — см. логи и снимки экрана"
          fi

      - name: GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="twinftp-v$(date +%Y%m%d-%H%M)"; fi
          git -C "$GITHUB_WORKSPACE" archive --format=zip --prefix=TwinFTP-source/ -o "$GITHUB_WORKSPACE/out/TwinFTP-source.zip" HEAD TwinFTP
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/out/TwinFTP-unsigned.ipa" \
            "$GITHUB_WORKSPACE/out/SHA256.txt" \
            "$GITHUB_WORKSPACE/out/TwinFTP-source.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TwinFTP $TAG" \
            --notes-file "$GITHUB_WORKSPACE/TwinFTP/RELEASE_NOTES.md"
