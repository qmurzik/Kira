name: Build KiraPvP

on:
  push:
    branches: ["**"]
    paths:
      - "KiraPvP/**"
      - ".github/workflows/build-kirapvp.yml"
  pull_request:
    paths:
      - "KiraPvP/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KiraPvP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ForgeGradle 2.1 (Minecraft 1.8.9) requires Java 8 - this is the one
      # thing the sandboxed dev session that wrote this mod could not provide.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # First build downloads Minecraft, Forge's userdev artifacts and MCP
      # mappings (a few hundred MB) - cache them so re-runs are fast.
      - name: Cache Gradle and ForgeGradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forgegradle-${{ hashFiles('KiraPvP/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-forgegradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KiraPvP-jar
          path: KiraPvP/build/libs/*.jar
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KiraPvP-build-reports
          path: |
            KiraPvP/build/reports/
            KiraPvP/build/*.log
          if-no-files-found: ignore
