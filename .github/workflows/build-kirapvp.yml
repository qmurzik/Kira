name: Build KiraPvP

on:
  push:
    branches: ["**"]
    paths:
      - "KiraPvP/**"
      - ".github/workflows/build-kirapvp.yml"
  pull_request:
    paths:
      - "KiraPvP/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KiraPvP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ForgeGradle 2.1 (Minecraft 1.8.9) requires Java 8 - this is the one
      # thing the sandboxed dev session that wrote this mod could not provide.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # First build downloads Minecraft, Forge's userdev artifacts and MCP
      # mappings (a few hundred MB) - cache them so re-runs are fast.
      - name: Cache Gradle and ForgeGradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forgegradle-${{ hashFiles('KiraPvP/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-forgegradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        id: build
        run: ./gradlew build --stacktrace --no-daemon
        continue-on-error: true

      # Only needed while pinning down a couple of exact 1.8.9 MCP method/
      # class names that couldn't be verified offline. Safe to delete once
      # the build is green - it does not affect the build itself.
      - name: Inspect Minecraft/Forge API (debug)
        if: steps.build.outcome == 'failure'
        run: |
          set -x
          echo "--- jars containing GuiScreen.class ---"
          : > /tmp/guiscreen_jars.txt
          find ~/.gradle -iname "*.jar" 2>/dev/null | while read -r j; do
            unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/GuiScreen.class" && echo "$j" >> /tmp/guiscreen_jars.txt
          done
          cat /tmp/guiscreen_jars.txt
          JAR=$(head -1 /tmp/guiscreen_jars.txt)
          if [ -n "$JAR" ]; then
            mkdir -p /tmp/inspect && cd /tmp/inspect
            unzip -o "$JAR" "net/minecraft/client/gui/GuiScreen.class" "net/minecraftforge/event/entity/player/PlayerEvent*.class" "net/minecraftforge/client/event/EntityViewRenderEvent*.class" "net/minecraftforge/client/event/RenderGameOverlayEvent*.class" 2>&1 || true
            echo "--- GuiScreen mouse-related methods ---"
            javap -p net/minecraft/client/gui/GuiScreen.class 2>&1 | grep -i "mouse\|key"
            echo "--- PlayerEvent nested classes present in jar ---"
            unzip -l "$JAR" | grep "PlayerEvent"
          else
            echo "Could not locate a jar containing GuiScreen.class"
          fi

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KiraPvP-jar
          path: KiraPvP/build/libs/*.jar
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KiraPvP-build-reports
          path: |
            KiraPvP/build/reports/
            KiraPvP/build/*.log
          if-no-files-found: ignore
