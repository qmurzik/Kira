name = "kira"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Переменные окружения (не секретные) ──────────────────────────────
# Секреты (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ключи AI-провайдеров)
# задаются через `wrangler secret put <NAME>` и сюда не попадают.
[vars]
AI_PROVIDER = "cloudflare"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
KIRA_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
KIRA_TOPIC_NAME = "Кира AI"
STRICT_TOPIC_ONLY = "false"
RATE_LIMIT_PER_HOUR = "30"
RESPONSE_DELAY_MS = "400"
SHORT_TERM_LIMIT = "12"
SHORT_TERM_TTL_SECONDS = "604800"
PHOTO_AUTO_INTERVAL_HOURS = "72"
OWNER_TELEGRAM_ID = "5110155633"
PROACTIVE_MESSAGE_PROBABILITY = "0.9"
PROACTIVE_MESSAGE_MIN_GAP_HOURS = "0.4"

# ── Workers AI (бесплатная модель по умолчанию) ─────────────────────
[ai]
binding = "AI"

# ── D1: долговременная память (профили, настройки чатов) ───────────
[[d1_databases]]
binding = "DB"
database_name = "qmods-telegram-bot"
database_id = "b2c7e985-5e1e-42f1-a8e2-a5df52f0ec22"
migrations_dir = "migrations"

# ── KV: краткосрочная память диалогов + rate limiting ───────────────
[[kv_namespaces]]
binding = "KIRA_KV"
id = "123524bd7acd461e8add70e138cd17a2"

# ── R2 пока не подключён: на аккаунте не включён R2 (Cloudflare Dashboard →
# R2 → Enable). Раскомментируйте после включения и `wrangler r2 bucket create kira-assets`.
# [[r2_buckets]]
# binding = "KIRA_ASSETS"
# bucket_name = "kira-assets"

# ── Cron: ежедневная гигиена (03:00 UTC) + каждые 30 минут в окне
# 06:00-23:59 UTC (≈ 09:00-02:59 MSK) для шанса, что Кира сама напишет
# создателю первой (см. src/telegram/proactiveMessages.ts). Вместе с
# PROACTIVE_MESSAGE_PROBABILITY/MIN_GAP_HOURS в среднем выходит "раз в
# полчаса плюс-минус", а не жёсткий таймер.
[triggers]
crons = ["0 3 * * *", "*/30 6-23 * * *"]
